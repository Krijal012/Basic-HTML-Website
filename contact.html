<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Contact | Your Name</title>
    <meta name="description" content="Contact Your Name for web development projects, collaboration, or inquiries.">
    <meta name="keywords" content="Contact, Frontend Developer, HTML, CSS, JavaScript">
    <meta name="author" content="Your Name">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Contact | Your Name">
    <meta property="og:description" content="Get in touch with Your Name through the contact form.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com/contact.html">
    <meta property="og:image" content="images/profile.png">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>

<body>

    <header>
        <h2>Your Name</h2>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <section>
            <h1>Contact Me</h1>
            <p>Feel free to reach out using the form below.</p>
        </section>
    </header>

    <main>

        <section>

            <form action="#" method="post">

                <p>
                    <label for="name">Full Name</label><br>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </p>

                <p>
                    <label for="email">Email Address</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </p>

                <p>
                    <label for="subject">Subject</label><br>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter the subject"
                        required>
                </p>

                <p>
                    <label for="message">Message</label><br>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        placeholder="Write your message..."
                        required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                    <button type="reset">Reset</button>
                </p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>

</body>
</html>
